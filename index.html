<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مَدار | MADAR</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
--dark:#173b38;--main:#245a53;--gold:#b99a61;
--bg:#f5f4f0;--white:#fff;--text:#263735;
--muted:#899390;--border:#e9ece8;--red:#b94d4d;
--green:#34836a
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Tajawal,sans-serif;color:var(--text)}
button,input,select{font-family:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{background:white;width:100%;max-width:420px;padding:30px;border-radius:20px;box-shadow:0 10px 40px #173b3810}
.logo{font-size:36px;font-weight:800;color:var(--dark);text-align:center}
.logo small{display:block;font-size:12px;letter-spacing:5px;color:var(--gold)}
.sub{text-align:center;color:var(--muted);margin:8px 0 25px}
input,select{width:100%;padding:13px;border:1px solid var(--border);border-radius:10px;background:white;margin:6px 0 14px;font-size:15px;outline:none}
input:focus,select:focus{border-color:var(--gold)}
label{font-size:13px;font-weight:700}
.btn{padding:12px 18px;border-radius:10px;background:var(--dark);color:white;font-weight:700}
.btn.gold{background:var(--gold);color:white}
.btn.light{background:#edf2ef;color:var(--dark)}
.btn.danger{background:#fff0f0;color:var(--red)}
.full{width:100%}
.auth-switch{text-align:center;margin-top:18px;font-size:14px;color:var(--muted)}
.auth-switch a{color:var(--main);font-weight:700;cursor:pointer}
#app{display:flex;min-height:100vh}
.sidebar{width:245px;background:var(--dark);color:white;padding:22px 15px;flex-shrink:0}
.sidebar .logo{color:white;text-align:right;font-size:27px;margin:0 10px 30px}
.sidebar .logo small{color:var(--gold);text-align:right}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{background:transparent;color:#d5e0dc;text-align:right;padding:13px;border-radius:9px;font-size:15px}
.nav button.active,.nav button:hover{background:#ffffff19;color:white}
.main{flex:1;min-width:0}
.topbar{min-height:72px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:12px 25px;gap:12px}
.topbar select{width:auto;min-width:170px;margin:0}
.content{padding:25px;max-width:1400px;margin:auto}
.page-title{font-size:25px;font-weight:800;margin:0 0 5px}
.muted{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:22px 0}
.stat,.panel{background:white;border:1px solid var(--border);border-radius:15px;padding:19px}
.stat span{color:var(--muted);font-size:13px}
.stat strong{display:block;font-size:27px;margin-top:9px;color:var(--dark)}
.panel{margin-top:18px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}
.panel-head h3{margin:0;font-size:18px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:13px 10px;text-align:right;border-bottom:1px solid var(--border);font-size:14px}
th{color:var(--muted);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:30px}
.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.modal-bg{position:fixed;inset:0;background:#0008;z-index:10;display:grid;place-items:center;padding:15px}
.modal{background:white;border-radius:17px;padding:24px;width:100%;max-width:470px;max-height:90vh;overflow:auto}
.modal h3{margin-top:0}
.modal-actions{display:flex;gap:9px;margin-top:15px}
.modal-actions button{flex:1}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--dark);color:white;padding:12px 22px;border-radius:12px;z-index:30;max-width:90%;text-align:center}
@media(max-width:850px){
#app{display:block}.sidebar{width:100%;padding:12px}
.sidebar .logo{margin:0 8px 10px}.nav{flex-direction:row;overflow:auto}
.nav button{white-space:nowrap;padding:9px 12px}
.grid{grid-template-columns:repeat(2,1fr)}
.content{padding:16px}.topbar{padding:12px 15px;flex-wrap:wrap}
}
@media(max-width:430px){.grid{gap:9px}.stat{padding:13px}.stat strong{font-size:22px}}
</style>
</head>

<body>

<section id="auth">
 <div class="auth-card">
  <div class="logo">مَدار<small>MADAR</small></div>
  <p class="sub">منصة إدارة المنشآت السياحية والضيافة</p>

  <div id="loginForm">
   <h3>تسجيل الدخول</h3>
   <label>البريد الإلكتروني</label>
   <input id="loginEmail" type="email" placeholder="name@example.com">
   <label>كلمة المرور</label>
   <input id="loginPassword" type="password" placeholder="كلمة المرور">
   <button class="btn full" onclick="login()">دخول إلى مدار</button>
   <p class="auth-switch">ليس لديك حساب؟ <a onclick="showRegister()">إنشاء حساب جديد</a></p>
   <p class="auth-switch"><a onclick="resetPassword()">نسيت كلمة المرور؟</a></p>
  </div>

  <div id="registerForm" class="hidden">
   <h3>إنشاء حساب جديد</h3>
   <label>الاسم الكامل</label>
   <input id="regName" placeholder="الاسم الكامل">
   <label>البريد الإلكتروني</label>
   <input id="regEmail" type="email" placeholder="name@example.com">
   <label>كلمة المرور</label>
   <input id="regPassword" type="password" placeholder="8 أحرف على الأقل">
   <button class="btn full" onclick="register()">إنشاء الحساب</button>
   <p class="auth-switch">لديك حساب؟ <a onclick="showLogin()">تسجيل الدخول</a></p>
  </div>
 </div>
</section>

<section id="app" class="hidden">
 <aside class="sidebar">
  <div class="logo">مَدار<small>MADAR</small></div>
  <div class="nav">
   <button class="active" onclick="navigate('home',this)">الرئيسية</button>
   <button onclick="navigate('units',this)">الوحدات</button>
   <button onclick="navigate('bookings',this)">الحجوزات</button>
   <button onclick="navigate('customers',this)">العملاء</button>
   <button onclick="navigate('finance',this)">المصروفات</button>
   <button onclick="navigate('reports',this)">التقارير</button>
   <button onclick="navigate('settings',this)">الإعدادات</button>
  </div>
 </aside>

 <main class="main">
  <header class="topbar">
   <strong id="welcome">مرحباً بك في مدار</strong>
   <div class="actions">
    <select id="tenantSelect" onchange="switchTenant(this.value)"></select>
    <button class="btn light" onclick="openTenantModal()">+ منشأة</button>
    <button class="btn light" onclick="logout()">خروج</button>
   </div>
  </header>
  <div class="content" id="page"></div>
 </main>
</section>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
getAuth,createUserWithEmailAndPassword,
signInWithEmailAndPassword,sendEmailVerification,
sendPasswordResetEmail,signOut,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

import {
getFirestore,doc,setDoc,getDoc,collection,
addDoc,getDocs,deleteDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

/* إعدادات مشروع MADAR */
const firebaseConfig={
 apiKey:"AIzaSyDBpLTfcB3mdyw-7M9Or7IKn9AnGdjNoCU",
 authDomain:"madar-d94c7.firebaseapp.com",
 projectId:"madar-d94c7",
 storageBucket:"madar-d94c7.firebasestorage.app",
 messagingSenderId:"1084532917912",
 appId:"1:1084532917912:web:c3054c50eaaf2fe1f232ed"
};

const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);
const db=getFirestore(firebaseApp);

let currentUser=null;
let currentTenant=null;
let tenants=[];
let currentPage="home";
let bookingUnits=[];

const $=id=>document.getElementById(id);

function toast(message){
 $("toastRoot").innerHTML=
 `<div class="toast">${escapeHTML(message)}</div>`;
 setTimeout(()=>$("toastRoot").innerHTML="",3500);
}

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function errorMessage(e){
 const errors={
 "auth/invalid-credential":"البريد أو كلمة المرور غير صحيحة",
 "auth/email-already-in-use":"البريد مستخدم مسبقاً",
 "auth/weak-password":"كلمة المرور ضعيفة",
 "auth/invalid-email":"البريد الإلكتروني غير صحيح",
 "auth/too-many-requests":"محاولات كثيرة، حاول لاحقاً",
 "permission-denied":"لا توجد صلاحية للوصول. راجع قواعد قاعدة البيانات."
 };
 return errors[e.code]||("حدث خطأ: "+e.message);
}

window.showRegister=()=>{
 $("loginForm").classList.add("hidden");
 $("registerForm").classList.remove("hidden");
};
window.showLogin=()=>{
 $("registerForm").classList.add("hidden");
 $("loginForm").classList.remove("hidden");
};

window.register=async()=>{
 const name=$("regName").value.trim();
 const email=$("regEmail").value.trim();
 const password=$("regPassword").value;

 if(!name||!email||password.length<8)
 return toast("أكمل البيانات واجعل كلمة المرور 8 أحرف على الأقل");

 try{
  const result=await createUserWithEmailAndPassword(auth,email,password);
  await setDoc(doc(db,"users",result.user.uid),{
   name,email,createdAt:serverTimestamp()
  });
  await sendEmailVerification(result.user);
  await signOut(auth);
  showLogin();
  toast("تم إنشاء الحساب. تحقق من بريدك الإلكتروني ثم سجل الدخول");
 }catch(e){toast(errorMessage(e))}
};

window.login=async()=>{
 try{
  const result=await signInWithEmailAndPassword(
   auth,$("loginEmail").value.trim(),$("loginPassword").value
  );
  if(!result.user.emailVerified){
   await sendEmailVerification(result.user);
   await signOut(auth);
   return toast("تحقق من بريدك الإلكتروني. أرسلنا رسالة التفعيل");
  }
 }catch(e){toast(errorMessage(e))}
};

window.resetPassword=async()=>{
 const email=$("loginEmail").value.trim();
 if(!email)return toast("أدخل بريدك الإلكتروني أولاً");
 try{
  await sendPasswordResetEmail(auth,email);
  toast("تم إرسال رابط استعادة كلمة المرور");
 }catch(e){toast(errorMessage(e))}
};

window.logout=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
 currentUser=user;
 if(user&&user.emailVerified){
  $("auth").classList.add("hidden");
  $("app").classList.remove("hidden");
  try{
   const profile=await getDoc(doc(db,"users",user.uid));
   $("welcome").textContent="مرحباً "+(profile.exists()?profile.data().name:"بك");
   await loadTenants();
  }catch(e){toast(errorMessage(e))}
 }else{
  $("app").classList.add("hidden");
  $("auth").classList.remove("hidden");
 }
});

async function loadTenants(){
 const snap=await getDocs(collection(db,"users",currentUser.uid,"tenants"));
 tenants=snap.docs.map(d=>({id:d.id,...d.data()}));

 $("tenantSelect").innerHTML=tenants.map(t=>
  `<option value="${escapeHTML(t.id)}">${escapeHTML(t.name)}</option>`
 ).join("");

 if(tenants.length){
  currentTenant=tenants[0].id;
  $("tenantSelect").value=currentTenant;
  render();
 }else{
  currentTenant=null;
  showCreateTenant();
 }
}

function showCreateTenant(){
 $("page").innerHTML=`
 <div class="panel">
  <h2>أهلاً بك في مدار</h2>
  <p class="muted">ابدأ بإنشاء منشأتك لإدارة الحجوزات والوحدات.</p>
  <button class="btn gold" onclick="openTenantModal()">إنشاء منشأة جديدة</button>
 </div>`;
}

window.openTenantModal=()=>{
 openModal("إنشاء منشأة",`
  <label>اسم المنشأة</label>
  <input id="tName" placeholder="مثال: شاليهات النخيل">
  <label>نوع النشاط</label>
  <select id="tType">
   <option>شاليهات</option>
   <option>استراحات</option>
   <option>شقق مفروشة</option>
   <option>فنادق</option>
   <option>مخيمات</option>
   <option>فلل</option>
   <option>أخرى</option>
  </select>
  <label>المدينة</label>
  <input id="tCity" placeholder="المدينة">
  <label>رقم التواصل</label>
  <input id="tPhone" placeholder="05xxxxxxxx">
 `,async()=>{
  const name=$("tName").value.trim();
  if(!name)return toast("اكتب اسم المنشأة");

  try{
   const ref=await addDoc(collection(db,"tenants"),{
    name,
    type:$("tType").value,
    city:$("tCity").value.trim(),
    phone:$("tPhone").value.trim(),
    ownerId:currentUser.uid,
    createdAt:serverTimestamp()
   });

   await setDoc(doc(db,"users",currentUser.uid,"tenants",ref.id),{
    name,role:"owner",createdAt:serverTimestamp()
   });

   closeModal();
   await loadTenants();
   toast("تم إنشاء المنشأة");
  }catch(e){toast(errorMessage(e))}
 });
};

window.switchTenant=id=>{
 currentTenant=id;
 render();
};

async function getItems(type){
 if(!currentTenant)return [];
 const snap=await getDocs(collection(db,"tenants",currentTenant,type));
 return snap.docs.map(d=>({id:d.id,...d.data()}));
}

async function addItem(type,data){
 if(!currentTenant)throw new Error("اختر منشأة أولاً");
 return addDoc(collection(db,"tenants",currentTenant,type),{
  ...data,createdAt:serverTimestamp(),createdBy:currentUser.uid
 });
}

async function removeItem(type,id){
 if(!currentTenant)throw new Error("اختر منشأة أولاً");
 await deleteDoc(doc(db,"tenants",currentTenant,type,id));
}

window.navigate=(page,button)=>{
 currentPage=page;
 document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
 if(button)button.classList.add("active");
 render();
};

async function render(){
 if(!currentTenant)return showCreateTenant();

 const names={
 home:"الرئيسية",units:"إدارة الوحدات",
 bookings:"الحجوزات",customers:"العملاء",
 finance:"المصروفات",reports:"التقارير",settings:"الإعدادات"
 };

 $("page").innerHTML=
 `<h1 class="page-title">${names[currentPage]}</h1>
 <p class="muted">إدارة منشأتك من مكان واحد</p>
 <div class="empty">جاري تحميل البيانات...</div>`;

 try{
  if(currentPage==="home")await renderHome();
  if(currentPage==="units")await renderUnits();
  if(currentPage==="bookings")await renderBookings();
  if(currentPage==="customers")await renderCustomers();
  if(currentPage==="finance")await renderFinance();
  if(currentPage==="reports")await renderReports();
  if(currentPage==="settings")await renderSettings();
 }catch(e){
  $("page").innerHTML+=
  `<p class="muted">${escapeHTML(errorMessage(e))}</p>`;
 }
}

function stat(label,value){
 return `<div class="stat"><span>${label}</span><strong>${value}</strong></div>`;
}

async function renderHome(){
 const [units,bookings,customers,expenses]=await Promise.all([
  getItems("units"),getItems("bookings"),
  getItems("customers"),getItems("expenses")
 ]);

 const income=bookings.reduce((s,b)=>s+Number(b.paid||0),0);
 const cost=expenses.reduce((s,e)=>s+Number(e.amount||0),0);

 $("page").innerHTML=`
 <h1 class="page-title">لوحة التحكم</h1>
 <p class="muted">ملخص أداء المنشأة</p>
 <div class="grid">
  ${stat("الوحدات",units.length)}
  ${stat("الحجوزات",bookings.length)}
  ${stat("العملاء",customers.length)}
  ${stat("صافي المقبوضات",(income-cost).toLocaleString("ar-SA")+" ر.س")}
 </div>
 <div class="panel">
  <h3>مرحباً بك في مدار</h3>
  <p class="muted">يمكنك إدارة وحداتك وحجوزاتك وعملائك من القائمة الرئيسية.</p>
 </div>`;
}

window.openModal=(title,body,onSave)=>{
 $("modalRoot").innerHTML=`
 <div class="modal-bg">
  <div class="modal">
   <h3>${title}</h3>
   ${body}
   <div class="modal-actions">
    <button class="btn" id="modalSave">حفظ</button>
    <button class="btn light" onclick="closeModal()">إلغاء</button>
   </div>
  </div>
 </div>`;
 $("modalSave").onclick=onSave;
};

window.closeModal=()=>$("modalRoot").innerHTML="";

function table(headers,rows){
 if(!rows.length)return `<div class="empty">لا توجد بيانات حتى الآن</div>`;
 return `<div class="table-wrap"><table>
 <thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
 <tbody>${rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>
 </table></div>`;
}

async function renderUnits(){
 const items=await getItems("units");
 $("page").innerHTML=`
 <div class="panel">
  <div class="panel-head">
   <h3>الوحدات</h3>
   <button class="btn gold" onclick="newUnit()">+ إضافة وحدة</button>
  </div>
  ${table(["اسم الوحدة","التصنيف","السعر اليومي","الإجراءات"],
   items.map(x=>[
    escapeHTML(x.name),escapeHTML(x.type),
    (x.price||0)+" ر.س",
    `<button class="btn danger" onclick="removeRecord('units','${x.id}')">حذف</button>`
   ]))}
 </div>`;
}

window.newUnit=()=>openModal("إضافة وحدة",`
 <label>اسم الوحدة</label>
 <input id="uName" placeholder="الوحدة الأولى">
 <label>التصنيف</label>
 <select id="uType">
  <option>شاليه</option><option>شقة</option><option>غرفة</option>
  <option>مخيم</option><option>فيلا</option><option>أخرى</option>
 </select>
 <label>السعر اليومي</label>
 <input id="uPrice" type="number" min="0" placeholder="0">
 <label>الوصف</label>
 <input id="uDesc" placeholder="اختياري">
`,async()=>{
 const name=$("uName").value.trim();
 if(!name)return toast("أدخل اسم الوحدة");
 await addItem("units",{
  name,type:$("uType").value,
  price:Number($("uPrice").value||0),
  description:$("uDesc").value
 });
 closeModal();render();toast("تمت إضافة الوحدة");
});

async function renderBookings(){
 const [items,units]=await Promise.all([
  getItems("bookings"),getItems("units")
 ]);
 bookingUnits=units;

 $("page").innerHTML=`
 <div class="panel">
  <div class="panel-head">
   <h3>الحجوزات</h3>
   <button class="btn gold" onclick="newBooking()">+ حجز جديد</button>
  </div>
  ${table(["العميل","الوحدة","الدخول","الخروج","الإجمالي","المدفوع","الحالة","الإجراءات"],
   items.map(x=>[
    escapeHTML(x.customer),escapeHTML(x.unitName),
    x.start,x.end,(x.total||0)+" ر.س",
    (x.paid||0)+" ر.س",escapeHTML(x.status),
    `<button class="btn danger" onclick="removeRecord('bookings','${x.id}')">حذف</button>`
   ]))}
 </div>`;
}

window.newBooking=()=>{
 const units=bookingUnits;
 if(!units.length)return toast("أضف وحدة قبل إنشاء الحجز");

 openModal("حجز جديد",`
  <label>اسم العميل</label><input id="bCustomer">
  <label>رقم الجوال</label><input id="bPhone">
  <label>الوحدة</label>
  <select id="bUnit">
   ${units.map(u=>`<option value="${u.id}">${escapeHTML(u.name)}</option>`).join("")}
  </select>
  <label>تاريخ الدخول</label><input id="bStart" type="date">
  <label>تاريخ الخروج</label><input id="bEnd" type="date">
  <label>إجمالي الحجز</label><input id="bTotal" type="number" min="0">
  <label>المبلغ المدفوع</label><input id="bPaid" type="number" min="0">
  <label>الحالة</label>
  <select id="bStatus">
   <option>مؤكد</option><option>بانتظار العربون</option>
   <option>مكتمل</option><option>ملغي</option>
  </select>
 `,async()=>{
  const customer=$("bCustomer").value.trim();
  const unit=units.find(u=>u.id===$("bUnit").value);
  const start=$("bStart").value;
  const end=$("bEnd").value;
  const total=Number($("bTotal").value||0);
  const paid=Number($("bPaid").value||0);

  if(!customer||!start||!end||!unit)
   return toast("أكمل بيانات الحجز");
  if(end<=start)return toast("تاريخ الخروج يجب أن يكون بعد الدخول");
  if(paid>total)return toast("المدفوع أكبر من الإجمالي");

  const all=await getItems("bookings");
  const conflict=all.some(b=>
   b.unitId===unit.id&&b.status!=="ملغي"&&
   start<b.end&&end>b.start
  );
  if(conflict)return toast("الوحدة محجوزة في هذه الفترة");

  await addItem("bookings",{
   customer,phone:$("bPhone").value.trim(),
   unitId:unit.id,unitName:unit.name,
   start,end,total,paid,remaining:total-paid,
   status:$("bStatus").value
  });

  closeModal();render();toast("تم حفظ الحجز");
 });
};

window.newExpense=()=>openModal("إضافة مصروف",`
 <label>البيان</label><input id="eTitle">
 <label>التصنيف</label>
 <select id="eCategory">
  <option>تشغيل</option><option>صيانة</option>
  <option>رواتب</option><option>مشتريات</option><option>أخرى</option>
 </select>
 <label>التاريخ</label>
 <input id="eDate" type="date" value="${new Date().toISOString().slice(0,10)}">
 <label>المبلغ</label><input id="eAmount" type="number" min="0">
`,async()=>{

  date:$("eDate").value,amount
 });
 closeModal();render();toast("تم تسجيل المصروف");
});

async function renderReports(){
 const [bookings,expenses,units]=await Promise.all([
  getItems("bookings"),getItems("expenses"),getItems("units")
 ]);
 const income=bookings.reduce((s,b)=>s+Number(b.paid||0),0);
 const total=bookings.reduce((s,b)=>s+Number(b.total||0),0);
 const costs=expenses.reduce((s,e)=>s+Number(e.amount||0),0);

 $("page").innerHTML=`
 <h1 class="page-title">التقارير</h1>
 <div class="grid">
  ${stat("عدد الوحدات",units.length)}
  ${stat("عدد الحجوزات",bookings.length)}
  ${stat("قيمة الحجوزات",total.toLocaleString("ar-SA")+" ر.س")}
  ${stat("المبالغ المقبوضة",income.toLocaleString("ar-SA")+" ر.س")}
 </div>
 <div class="panel">
  <h3>ملخص مالي</h3>
  <p>المقبوضات: <strong>${income.toLocaleString("ar-SA")} ر.س</strong></p>
  <p>المصروفات: <strong>${costs.toLocaleString("ar-SA")} ر.س</strong></p>
  <p>الصافي: <strong>${(income-costs).toLocaleString("ar-SA")} ر.س</strong></p>
 </div>`;
}

window.removeRecord=async(type,id)=>{
 if(!confirm("هل أنت متأكد من الحذف؟"))return;
 try{
  await removeItem(type,id);
  toast("تم الحذف");
  render();
 }catch(e){toast(errorMessage(e))}
};
