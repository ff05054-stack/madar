<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b38">
<title>مَدار | MADAR</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<section id="auth">
 <div class="auth-card">
  <div class="logo">مَدار<small>MADAR</small></div>
  <p class="sub">إدارة المنشآت السياحية والضيافة</p>
  <div id="loginForm">
   <label>البريد الإلكتروني</label><input id="loginEmail" type="email" autocomplete="email">
   <label>كلمة المرور</label><input id="loginPassword" type="password" autocomplete="current-password">
   <button class="btn full" id="loginBtn">دخول</button>
   <p class="switch"><a id="toRegister">إنشاء حساب جديد</a> · <a id="resetBtn">نسيت كلمة المرور؟</a></p>
  </div>
  <div id="registerForm" class="hidden">
   <label>الاسم الكامل</label><input id="regName" autocomplete="name">
   <label>البريد الإلكتروني</label><input id="regEmail" type="email" autocomplete="email">
   <label>كلمة المرور (8 أحرف على الأقل)</label><input id="regPassword" type="password" autocomplete="new-password">
   <button class="btn full" id="registerBtn">إنشاء الحساب</button>
   <p class="switch"><a id="toLogin">لديك حساب؟ سجّل دخولك</a></p>
  </div>
 </div>
</section>

<section id="app" class="hidden">
 <header class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="القائمة">☰</button>
  <select id="tenantSelect" aria-label="المنشأة"></select>
  <button class="icon-btn" id="addTenantBtn" aria-label="منشأة جديدة">+</button>
 </header>
 <main id="page"></main>
 <nav class="bottom-nav" id="bottomNav"></nav>
</section>

<div id="drawerBg" class="drawer-bg hidden"></div>
<aside id="drawer" class="drawer"></aside>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
